name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # @see kb/01a03c27-918e-737a-b288-1b27a6c2ddca.md
      - name: Regenerate doc surfaces
        run: |
          npm run commands:surface
          npm run faq:surface
          npm run check:command-surface
          npm run check:faq-surface
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Smoke test
        run: npm test
      - name: Package bin smoke test
        run: npm run test:pack-bin
      - name: Test version script
        run: node scripts/version.mjs --release --from "$(node scripts/version.mjs)"

  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # The same check the pre-push hook runs, so a pull request cannot fail on
      # something the push already had every chance to catch. The SHAs go
      # through the environment rather than into the script text, so a branch
      # name can never be read as shell.
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-signoff.mjs "$BASE..$HEAD"

name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Generated README surfaces are a release artifact, so the runner
      # produces them instead of the branch carrying them. Build and test then
      # run against the output this code actually renders. The --check pass
      # regenerates on top of what was just written, so it asserts determinism
      # rather than branch freshness: nothing is committed, and a README that
      # differs from the branch is not a failure here.
      - name: Regenerate README surfaces
        run: |
          npm run commands:surface
          npm run faq:surface
          npm run check:command-surface
          npm run check:faq-surface
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Smoke test
        run: npm test
      - name: Package bin smoke test
        run: npm run test:pack-bin
      - name: Check version script
        run: |
          node scripts/version.mjs
          node scripts/version.mjs --release

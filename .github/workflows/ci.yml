name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Smoke test
        run: npm test
      - name: Package bin smoke test
        run: npm run test:pack-bin
      - name: Check version script
        run: |
          node scripts/version.mjs
          node scripts/version.mjs --release

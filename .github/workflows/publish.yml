name: Publish

# Push to main -> dev build (yyyy.m.d-utcmillis, npm tag "dev").
# Manual dispatch -> release (yyyy.m.d, npm tag "latest") + GitHub release.
# Auth is npm trusted publishing (OIDC) — no token secret needed.
on:
  push:
    branches: [main]
    # Only publish a dev build when something that reaches the npm package
    # (or the pipeline that builds it) changes.
    paths:
      - "src/**"
      - "scripts/**"
      - "kb/**"
      - .prettierrc.json
      - package.json
      - package-lock.json
      - tsconfig.json
      - README.md
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write # gh release create (release path only)
  id-token: write # npm trusted publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Pin npm: trusted publishing needs >= 11.5.1, but npm@latest (11.7.x)
      # ships a provenance path that can't load 'sigstore', breaking OIDC
      # publish. Pin to the known-good minimum instead of floating latest.
      - name: Update npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@11.5.1
      - run: npm ci
      # This workflow is the one that produces the published README, so every
      # check below it runs with both generated surfaces current in the
      # worktree. The --check pass regenerates on top of what was just written
      # and asserts the generators are deterministic.
      - name: Regenerate README surfaces
        run: |
          npm run commands:surface
          npm run faq:surface
          npm run check:command-surface
          npm run check:faq-surface
      - name: Format check
        run: npm run format:check
      - name: Compute version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=$(node scripts/version.mjs --release)" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      # Before the stamp, on purpose. nosedive renders its own reproducible
      # invocation from the running package version, so a stamped-but-unpublished
      # version makes every `npx -y nosedive@<version>` it writes unresolvable --
      # including the managed pre-push hook the suite executes. At 0.0.0-dev the
      # invocation is the local build, which is what every developer machine runs.
      - name: Smoke test
        run: npm test
      - name: Stamp version
        run: npm version --no-git-tag-version "${{ steps.version.outputs.version }}"
      - name: Package bin smoke test
        run: npm run test:pack-bin
      # npm rejects duplicate versions, which enforces the one-release-per-day rule.
      - name: Publish to npm
        run: npm publish --tag "${{ steps.version.outputs.tag }}" --access public
      # Trusted publishing authenticates `npm publish`, but not `npm dist-tag`.
      # Leave an explicit follow-up instead of failing after the package is live.
      - name: Note manual compatibility tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          level=$(node scripts/compatibility-level.mjs)
          {
            echo "### Manual npm compatibility tag"
            echo
            echo 'Trusted publishing does not authenticate `npm dist-tag`; run:'
            echo
            echo '```sh'
            printf 'npm dist-tag add "nosedive@%s" "level-%s"\n' \
              "${{ steps.version.outputs.version }}" "$level"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release and tag
        if: github.event_name == 'workflow_dispatch'
        run: gh release create "v${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
